  Saytga (boost-top.com/mmb = mmb.boost-top.com) yuklanadi - platform/mmb_home_page.html shu manzilni ochadi.
  CEF1 (Chrome 17): faqat ES5, flexbox/vh/calc yo'q — hamma narsa absolute + px.
  O'yin bilan aloqa: nextclient.exec / getCvarValue / matchmaking / console / gameUi.
  Akkaunt: xc_api.php (shu papkada).
-->
<meta http-equiv="Cache-Control" content="no-cache">
<script>
/* O'yin brauzeri (CEF) sahifani soatlab xotiradan ochishi mumkin - yangilanish ko'rinmay qoladi.
 * Har ochilishda server "qaysi versiya" deb so'raladi (beta testerlarga - beta, boshqalarga - barqaror, admin panel > Menyu versiyalari).
 * Boshqa bo'lsa - o'sha versiyaning sahifasi (rel/<versiya>/index.html) yuklanib, joriy sahifa shu bilan almashtiriladi. */
(function () {
  var V = '10198600';
  window.XC_V = V;
  try {
    if (window.name === 'xcfresh' + V) return;
    var t = new Date().getTime(), get = function (u) { var x = new XMLHttpRequest(); x.open('GET', u, false); x.send(null); return x; }, ok = function (v) { return /^\d{6,12}$/.test(v); };
    var v = '';
    try { var a = get('xc_api.php?a=menuver&t=' + t); if (a.status === 200) v = String(a.responseText || '').replace(/\s+/g, ''); } catch (e) {}
    if (!ok(v)) { var b = get('ver.txt?t=' + t); v = b.status === 200 ? String(b.responseText || '').replace(/\s+/g, '') : ''; }
    if (!ok(v) || v === V || window.name === 'xcfresh' + v) return;
    window.name = 'xcfresh' + v;
    var y = null;
    try { y = get('rel/' + v + '/index.html?t=' + t); } catch (e) {}
    if (!y || y.status !== 200 || y.responseText.indexOf('id="app"') < 0) {
      var me = (/[^\/]+\.html$/.exec(location.pathname) || ['index.html'])[0];   // xc.html (X CLIENT launcheri) yoki index.html
      y = get(me + '?t=' + t);
    }
    if (y.status === 200 && y.responseText.indexOf('id="app"') > 0) {
      // eski sahifaning qolgan qismi ishlamasin (plaintext), yuklanib bo'lgach - yangisi bilan almashtiramiz
      var fresh = y.responseText;
      document.write('<plaintext style="display:none">');
      window.addEventListener('load', function () { document.open(); document.write(fresh); document.close(); }, false);
    }
  } catch (e) {}
})();
</script>

<script>
/* Xato bo'lsa ekranning tepasida ko'rsatamiz (o'yin brauzerida konsol yo'q) */
window.XC_ERRS = [];
window.onerror = function (msg, url, line) {
  var t = String(msg) + ' (' + String(url || '').replace(/^.*\//, '') + ':' + line + ')';
  window.XC_ERRS.push(t); if (window.XC_ERRS.length > 20) window.XC_ERRS.shift();   // takrorlanuvchi xato soatlab o'smasin
  var d = document.getElementById('xcerr');
  if (!d && document.body) { d = document.createElement('div'); d.id = 'xcerr'; d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:999;padding:6px 12px;font:13px Tahoma,Arial;color:#fff;background:#b3161c'; document.body.appendChild(d); }
  if (d) d.innerHTML = 'X CLIENT xato: ' + window.XC_ERRS.join(' | ').replace(/</g, '&lt;');
  try {                                                       // admin panelga avtomatik (sahifada 5 tagacha)
    if (window.XC_ERRS.length <= 5) { var x = new XMLHttpRequest(); x.open('POST', 'xc_api.php', true); x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      x.send('a=jserr&msg=' + encodeURIComponent(String(msg)) + '&src=' + encodeURIComponent(String(url || '').replace(/^.*\//, '')) + '&line=' + (line || 0) + '&ver=' + encodeURIComponent(window.XC_V || '')); }
  } catch (e) {}
  return false;
};
</script>

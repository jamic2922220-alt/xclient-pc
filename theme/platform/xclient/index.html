<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>X CLIENT</title>
<!--
  X CLIENT — o'yin ichidagi bosh menyu (NextClient Main Menu Browser).
  Saytga (boost-top.com/mmb = mmb.boost-top.com) yuklanadi - platform/mmb_home_page.html shu manzilni ochadi.
  CEF1 (Chrome 17): faqat ES5, flexbox/vh/calc yo'q — hamma narsa absolute + px.
  O'yin bilan aloqa: nextclient.exec / getCvarValue / matchmaking / console / gameUi.
  Akkaunt: xc_api.php (shu papkada).
-->
<link rel="stylesheet" href="xc.css?v=10170922">
<script>
/* Xato bo'lsa ekranning tepasida ko'rsatamiz (o'yin brauzerida konsol yo'q) */
window.XC_ERRS = [];
window.onerror = function (msg, url, line) {
  var t = String(msg) + ' (' + String(url || '').replace(/^.*\//, '') + ':' + line + ')';
  window.XC_ERRS.push(t);
  var d = document.getElementById('xcerr');
  if (!d && document.body) { d = document.createElement('div'); d.id = 'xcerr'; d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:999;padding:6px 12px;font:13px Tahoma,Arial;color:#fff;background:#b3161c'; document.body.appendChild(d); }
  if (d) d.innerHTML = 'X CLIENT xato: ' + window.XC_ERRS.join(' | ').replace(/</g, '&lt;');
  return false;
};
</script>
<script src="xc_lang.js?v=10182000"></script>
</head>
<body>
<div id="app">

  <!-- ===== logo ===== -->

    <img src="logo.png" alt="">
    <div class="lt">
      <div class="xc"><span>X</span> CLIENT</div>

  <!-- ===== chap menyu ===== -->

    <div class="mi" data-act="quit"><i>&#10005;</i><span data-t="m_quit"></span></div>
  </div>

  <!-- ===== o'ng ustun ===== -->

    <!-- akkauntga kirmaganlar uchun ko'zga tashlanadigan karta -->

      <div class="acx">X</div>
      <div class="act1" data-t="ac_t1"></div>
      <div class="act2" data-t="ac_t2"></div>
      <div class="acl"><span>&#10003; <b data-t="ac_b1"></b></span><span>&#10003; <b data-t="ac_b2"></b></span><span>&#10003; <b data-t="ac_b3"></b></span></div>
      <a class="btn red acbtn" data-act="login"><span data-t="a_login"></span> &#8594;</a>
    </div>
     <div class="card">
      <div class="ct"><span data-t="top_title"></span><span class="mut" data-t="ad"></span></div>
      <div id="topList"></div>
    </div>

    <div class="card" style="display:none">   <!-- TOP HAFTA: kerak emas -->

name: diag
on:
  push:
    branches: [claude/diag]
    paths: [diag/run.sh, diag/load.js, .github/workflows/diag.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: bash diag/run.sh || true
        env:
          GH_TOKEN: ${{ github.token }}
      - shell: bash
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f diag/out && git commit -qm "diag natijalari" && git push -q origin HEAD:claude/diag-out --force

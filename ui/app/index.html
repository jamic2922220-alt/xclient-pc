<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>X CLIENT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="drag"></div>
<div id="winbtns"><span id="bMin" title="—">—</span><span id="bClose" title="✕">✕</span></div>

<!-- ================= BOSH MENYU ================= -->
<section id="home" class="screen on">
  <div class="bg"></div><div class="vig"></div>
  <div class="logo"><img src="img/logo.png" alt=""><div><div class="cs">X CLIENT</div><div class="sub"><span class="bt">CS 1.6</span><span class="v">by BOOST-TOP</span></div></div></div>

  <nav class="menu" id="menu">
    <div class="mi on" data-act="quick"><span class="k">▶</span><span data-t="m_quick"></span></div>
    <div class="mi" data-act="servers"><span class="k">◎</span><span data-t="m_servers"></span><span class="n" id="mOnline"></span></div>
    <div class="mi" data-act="bots"><span class="k">✦</span><span data-t="m_bots"></span></div>
    <div class="mi" data-act="xtop"><span class="k">★</span><span data-t="m_top"></span><span class="n">TOP</span></div>
    <div class="sep"></div>
    <div class="mi" data-act="settings"><span class="k">⚙</span><span data-t="m_settings"></span></div>
    <div class="mi" data-act="quit"><span class="k">✕</span><span data-t="m_quit"></span></div>
  </nav>

  <div class="play" id="playBtn"><div class="tri"></div><div><b data-t="play"></b><small id="playSrv">…</small></div><div class="p"><span id="playPing">–</span>ms</div></div>

  <div class="col">
    <div class="card" id="newsCard"><div class="hero"><span class="tag" data-t="news"></span><div class="tr">⚡</div><div class="tx"><b id="newsTitle">X CLIENT v1.0</b><span id="newsText"></span></div></div></div>
    <div class="card"><div class="t"><span data-t="top_srv"></span><span class="mut link" data-act="servers" data-t="all"></span></div><div id="topList"><div class="row mut" data-t="loading"></div></div></div>
  </div>

  <div class="bar">
    <div class="me"><span class="av" id="meAv">X</span><div><b id="meName">Player</b><div class="mut" id="meTag"></div></div></div>
    <span class="vip">VIP</span>
    <span class="st"><span data-t="online"></span> <b class="gr" id="stOnline">–</b></span>
    <span class="st"><span data-t="servers_cnt"></span> <b id="stSrv">–</b></span>
    <span class="st" id="stSaved"></span>
    <span class="ok" id="stVer"></span>
  </div>
</section>

<!-- ================= SERVERLAR ================= -->
<section id="servers" class="screen win-screen">
  <div class="win">
    <div class="ttl"><img src="img/logo.png" alt=""><span data-t="w_servers"></span><span class="x" data-close>✕</span></div>
    <div class="tabs" id="srvTabs">
      <div class="tab on" data-tab="net" data-t="t_net"></div>
      <div class="tab" data-tab="fav"><span data-t="t_fav"></span> <span class="mut" id="favCnt"></span></div>
      <div class="tab" data-tab="hist" data-t="t_hist"></div>
      <div class="tab" data-tab="friends" data-t="t_friends"></div>
      <div class="tab" data-tab="xtop" data-t="t_xtop"></div>
      <div class="tab" data-tab="lan" data-t="t_lan"></div>
    </div>
    <div class="pane col2">
      <div class="left">
        <div class="filters" id="srvFilters">
          <input class="inp" id="fSearch" data-tp="search">
          <span class="chipf" data-f="ping" data-t="f_ping"></span>
          <span class="chipf" data-f="notempty" data-t="f_notempty"></span>
          <span class="chipf" data-f="notfull" data-t="f_notfull"></span>
          <span class="chipf" id="addIp" data-t="add_ip"></span>
          <span class="btn r ml" id="quickBtn">⚡ <span data-t="m_quick"></span></span>
        </div>
        <div class="tablewrap"><table id="srvTable"><thead><tr><th>★</th><th data-t="c_server"></th><th data-t="c_players"></th><th data-t="c_map"></th><th data-t="c_ping"></th><th id="cExtra"></th></tr></thead><tbody></tbody></table>
          <div class="empty" id="srvEmpty"></div></div>
      </div>
      <div class="det" id="det">
        <div class="map"><span id="dMap">—</span></div>
        <div class="dn" id="dName">—</div><div class="mut" id="dAddr"></div>
        <div class="drow"><span><span data-t="c_players"></span> <b id="dPl">–</b></span><span class="gr" id="dPing"></span></div>
        <div class="h" data-t="players"></div><div id="dList" class="dlist"></div>
        <div class="xnote">★ <span data-t="vip_note"></span></div>
      </div>
    </div>
    <div class="foot"><span class="mut" id="srvFoot"></span><span class="btn" id="refBtn">⟳ <span data-t="refresh"></span></span><span class="btn" id="favBtn">★ <span data-t="to_fav"></span></span><span class="btn r" id="joinBtn">▶ <span data-t="join"></span></span></div>
  </div>
</section>

<!-- ================= SOZLAMALAR ================= -->
<section id="settings" class="screen win-screen">
  <div class="win">
    <div class="ttl"><img src="img/logo.png" alt=""><span data-t="w_settings"></span><span class="x" data-close>✕</span></div>
    <div class="tabs" id="setTabs">
      <div class="tab on" data-tab="game" data-t="s_game"></div>
      <div class="tab" data-tab="keys" data-t="s_keys"></div>
      <div class="tab" data-tab="mouse" data-t="s_mouse"></div>
      <div class="tab" data-tab="sound" data-t="s_sound"></div>
      <div class="tab" data-tab="video" data-t="s_video"></div>
      <div class="tab" data-tab="hud" data-t="s_hud"></div>
      <div class="tab" data-tab="acc" data-t="s_acc"></div>
      <div class="tab" data-tab="sys" data-t="s_sys"></div>
    </div>
    <div class="pane" id="setPane"></div>
    <div class="foot"><span class="mut" id="setFoot"></span><span class="btn" id="setDef" data-t="defaults"></span><span class="btn" data-close data-t="cancel"></span><span class="btn r" id="setSave" data-t="save"></span></div>
  </div>
</section>

<!-- ================= BOTLAR ================= -->
<section id="bots" class="screen win-screen">
  <div class="win small">
    <div class="ttl"><img src="img/logo.png" alt=""><span data-t="m_bots"></span><span class="x" data-close>✕</span></div>
    <div class="pane col"><div class="card">
      <div class="row2"><label data-t="c_map"></label><select id="botMap"></select></div>
      <div class="row2"><label data-t="bot_count"></label><input type="range" id="botN" min="0" max="20" value="9"><span class="val" id="botNv">9</span></div>
      <div class="row2"><label data-t="bot_diff"></label><select id="botDiff"><option value="0" data-t="d0"></option><option value="1" data-t="d1"></option><option value="2" selected data-t="d2"></option><option value="3" data-t="d3"></option><option value="4" data-t="d4"></option></select></div>
    </div></div>
    <div class="foot"><span class="mut"></span><span class="btn" data-close data-t="cancel"></span><span class="btn r" id="botGo">▶ <span data-t="play"></span></span></div>
  </div>
</section>

<div id="toast"></div>
<div id="modal" class="modal"><div class="mbox"><div id="mText"></div><input class="inp" id="mInput"><div class="mbtns"><span class="btn" id="mNo" data-t="cancel"></span><span class="btn r" id="mYes">OK</span></div></div></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
